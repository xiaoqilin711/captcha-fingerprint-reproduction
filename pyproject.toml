[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-fingerprint-reproduction"
version = "0.1.0"
description = "Runtime reverse-engineering of a major vendor's click captcha: POW recovery, environment-fingerprint replay, and obfuscation tooling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xiaoqilin711" }]
keywords = [
    "reverse-engineering",
    "captcha",
    "fingerprint",
    "obfuscation",
    "spidermonkey",
    "proof-of-work",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pow-reproduce = "pow.reproduce_pow:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
